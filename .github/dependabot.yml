# Automated dependency upgrades (ADR-0001). CI validates every upgrade PR.
version: 2
updates:
  - package-ecosystem: maven
    directory: /api
    schedule:
      interval: weekly
    groups:
      api:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
