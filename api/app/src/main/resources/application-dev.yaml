# Local development: Spring Boot starts deploy/compose.yaml and derives the datasource (ADR-0001).
# Path is relative to the working directory, which must be api/app.
spring:
  config:
    # Dev values for BWM_* variables; real environment variables take precedence.
    import: file:../../deploy/.env[.properties]
  docker:
    compose:
      enabled: true
      file: ../../deploy/compose.yaml

logging:
  level:
    dev.bearwithme: debug
