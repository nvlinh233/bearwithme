spring:
  application:
    name: bearwithme
  profiles:
    # v1 runs locally only; tests activate "test" explicitly.
    default: dev
  docker:
    compose:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Groups INSERTs that do not need a generated id (e.g. review_states) into JDBC batches
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  servlet:
    multipart:
      # FR-I2: CSV import limit (larger uploads get 413 before reaching the controller)
      max-file-size: 2MB
      max-request-size: 3MB
  flyway:
    locations: classpath:db/migration
    # Values come from environment variables (ADR-0001); startup fails if they are missing.
    placeholders:
      "[seed_username]": ${BWM_SEED_USERNAME}
      "[seed_password]": ${BWM_SEED_PASSWORD}

bearwithme:
  jwt:
    secret: ${BWM_JWT_SECRET}
    issuer: ${BWM_JWT_ISSUER}
    ttl: 7d

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info
