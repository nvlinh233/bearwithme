spring:
  application:
    name: bearwithme
  profiles:
    # v1 runs locally only; tests activate "test" explicitly.
    default: dev
  docker:
    compose:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    # Values come from environment variables (ADR-0001); startup fails if they are missing.
    placeholders:
      "[seed_username]": ${BWM_SEED_USERNAME}
      "[seed_password]": ${BWM_SEED_PASSWORD}

bearwithme:
  jwt:
    secret: ${BWM_JWT_SECRET}
    issuer: ${BWM_JWT_ISSUER}
    ttl: 7d

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info
